<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fafbf9">
  <title>Voice clone · Team</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#1f2925; background:#fafbf9; font-synthesis:none; }
    * { box-sizing:border-box; }
    body { margin:0; }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.48; }
    input, select, button { outline-offset:3px; }
    input, select { color:inherit; }
    .wrap { width:min(1120px,calc(100% - 40px)); margin:0 auto; }
    header { height:83px; border-bottom:1px solid #e5eae5; background:white; }
    header .wrap { height:100%; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .logo { display:flex; align-items:center; gap:11px; font-weight:730; letter-spacing:-.035em; font-size:20px; white-space:nowrap; }
    .logo-mark { width:29px; height:29px; border-radius:9px; background:#dcebe4; display:grid; place-items:center; }
    .logo-mark svg { width:18px; height:18px; stroke:#27634e; }
    .top-right { display:flex; align-items:center; gap:15px; font-size:13px; color:#6a756f; }
    .person { display:flex; align-items:center; gap:8px; white-space:nowrap; }
    .person select { border:1px solid #e0e6e0; border-radius:9px; background:white; padding:9px 28px 9px 11px; max-width:132px; }
    .sync { display:inline-flex; align-items:center; gap:7px; }
    .dot { height:6px; width:6px; background:#40986b; border-radius:50%; }
    .dot.offline { background:#d09a48; }
    main { padding:42px 0 72px; }
    .eyebrow { font-size:11px; letter-spacing:.12em; font-weight:750; color:#68907e; text-transform:uppercase; margin-bottom:10px; }
    h1 { font-size:32px; font-weight:740; letter-spacing:-.05em; margin:0 0 7px; }
    .sub { color:#7d8781; font-size:14px; margin:0; }
    .section-head { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:28px; }
    .primary { background:#2e7458; border:1px solid #2e7458; border-radius:9px; color:white; font-weight:620; padding:11px 17px; }
    .primary:hover { background:#235e47; }
    .ghost { border:1px solid #e0e5e0; background:white; color:#34443b; border-radius:9px; padding:10px 14px; font-weight:600; }
    .ghost:hover { background:#f5f8f5; }
    .small { font-size:12px; padding:8px 12px; }
    .linkish { background:none; border:0; color:#3c745f; font-size:12px; font-weight:650; padding:7px; }
    .panel { background:white; border:1px solid #e6ebe6; border-radius:15px; }
    .poll-top { padding:20px 22px 17px; display:flex; gap:20px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .pill-row { display:flex; gap:7px; flex-wrap:wrap; }
    .member-pill { font-size:12px; color:#8b958f; border-radius:20px; padding:6px 10px; background:#f5f7f5; }
    .member-pill.done { color:#28694f; background:#e7f2eb; }
    .member-pill.tentative { color:#b0b7b1; background:#f9faf9; }
    .poll-controls { display:flex; align-items:center; gap:9px; }
    .hint { color:#929b94; font-size:12px; }
    .poll-scroll { overflow:auto; border-top:1px solid #edf0ed; border-bottom:1px solid #edf0ed; user-select:none; }
    .poll-grid { border-spacing:3px; table-layout:fixed; width:100%; min-width:650px; padding:10px 16px 13px; }
    .poll-grid th { font-weight:610; color:#7c8a81; font-size:12px; text-align:center; height:33px; }
    .poll-grid .time { width:60px; text-align:right; padding-right:12px; color:#8f9b94; font-size:11px; font-weight:500; }
    .poll-grid td.slot { cursor:crosshair; height:21px; border-radius:3px; border:1px solid #eff3ef; background:#f6f8f6; transition:background-color .08s; touch-action:none; }
    .poll-grid td.slot.mine { box-shadow:inset 0 0 0 1.5px #2b7356; }
    .poll-grid td.slot:hover { outline:1px solid #358166; }
    .poll-grid .hour-divider td.slot { border-top-color:#d9e0db; }
    .poll-footer { display:flex; gap:12px; align-items:center; justify-content:space-between; padding:17px 21px; flex-wrap:wrap; }
    .poll-footer .left { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .count { color:#506d5f; font-size:12px; font-weight:650; }
    .choices { margin-top:16px; padding:22px; }
    .choices .label { font-size:12px; color:#7e8880; font-weight:650; margin-bottom:14px; }
    .choices-list { display:flex; gap:8px; flex-wrap:wrap; }
    .choice { padding:11px 14px; background:#fafbf9; border:1px solid #e4eae4; border-radius:10px; min-width:140px; text-align:left; }
    .choice strong { display:block; font-size:14px; }
    .choice span { display:block; color:#7e8d83; font-size:12px; margin-top:4px; }
    .choice.picked { border-color:#42866c; background:#f1f8f4; }
    .choices-bottom { display:flex; align-items:center; gap:13px; justify-content:space-between; margin-top:17px; }
    .notice { margin-top:17px; color:#8b6840; font-size:12px; }
    .meeting-chip { color:#3b6955; font-size:13px; font-weight:600; background:#eef5f0; padding:11px 14px; border-radius:9px; }
    .milestone { margin:23px 0 27px; padding:23px 26px; }
    .milestone-main { display:flex; justify-content:space-between; align-items:center; gap:20px; }
    .milestone-name { font-size:17px; font-weight:720; letter-spacing:-.026em; }
    .milestone-count { font-size:13px; color:#6b8275; font-weight:650; }
    .bar { height:6px; background:#edf2ee; border-radius:8px; margin:19px 0 13px; overflow:hidden; }
    .bar > div { background:#40866a; border-radius:8px; height:100%; transition:width .2s; }
    details > summary { list-style:none; cursor:pointer; font-size:12px; font-weight:650; color:#50816a; width:max-content; }
    details > summary::-webkit-details-marker { display:none; }
    .checklist { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 20px; margin:20px 0 0; padding-top:18px; border-top:1px solid #edf0ed; }
    .checklist label { font-size:13px; display:flex; align-items:center; gap:9px; }
    .checklist input { accent-color:#3b8063; width:16px; height:16px; }
    .tasks { overflow-x:auto; }
    .tasks table { border-collapse:collapse; width:100%; min-width:745px; }
    .tasks th { font-size:11px; font-weight:730; letter-spacing:.065em; text-transform:uppercase; color:#9aa59e; text-align:left; padding:15px 17px; background:#fafcf9; }
    .tasks td { padding:17px; border-top:1px solid #f0f2ef; font-size:13px; }
    .tasks tr.own td { background:#f7faf7; }
    .tasks td:first-child { width:155px; }
    .tasks td:nth-child(2) { width:42%; }
    .tasks td:nth-child(3) { width:165px; }
    .tasks td:nth-child(4) { width:96px; }
    .tasks td:nth-child(5) { width:145px; }
    .name { display:flex; align-items:center; gap:10px; font-weight:650; white-space:nowrap; }
    .avatar { width:30px; height:30px; border-radius:10px; display:grid; place-items:center; font-weight:720; font-size:11px; color:#456957; background:#eaf3ec; }
    .task-input { width:100%; border:1px solid #d7e2d9; border-radius:8px; padding:10px 12px; min-width:175px; background:white; }
    .task-view { display:block; max-width:430px; overflow-wrap:anywhere; line-height:1.5; }
    .muted { color:#aab2ac; }
    .status { border-radius:7px; font-size:12px; font-weight:630; padding:9px 10px; width:100%; border:1px solid #e5ebe5; background:#f5f7f5; color:#66766b; }
    .status.progress { background:#eaf3ed; color:#39765b; border-color:#dbe9df; }
    .status.waiting { background:#fff4e8; color:#9b6c36; border-color:#f8e7d3; }
    .status.done { background:#e1f2e8; color:#26724a; border-color:#cce6d7; }
    select.status { cursor:pointer; }
    .eta-input { border:1px solid #dae5dc; background:white; width:62px; border-radius:8px; padding:10px 7px; }
    .due-input { border:1px solid #dae5dc; background:white; border-radius:8px; padding:9px 6px; font-size:12px; width:130px; }
    .day-label { color:#95a197; font-size:11px; margin-left:4px; }
    .waiting-input { width:100%; border:1px solid #edd9bf; background:#fffbf5; padding:8px 10px; border-radius:7px; margin-top:7px; font-size:12px; }
    .waiting-view { font-size:11px; color:#9b6c36; margin-top:5px; }
    .empty-status { font-size:12px; color:#acb4ad; }
    .bottom { display:flex; justify-content:space-between; gap:20px; color:#a0aaa1; font-size:12px; padding-top:18px; }
    .preview-note { padding:10px 13px; border:1px solid #f0e3ce; background:#fffaf0; color:#8c6a3b; border-radius:9px; font-size:12px; margin-bottom:20px; }
    .inline-tools { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .hidden { display:none!important; }
    @media(max-width:650px) { .wrap{width:calc(100% - 28px)} main{padding-top:28px} header{height:72px} h1{font-size:27px} .top-right{gap:6px} .sync{display:none} .section-head{align-items:flex-start; flex-direction:column; gap:14px;} .poll-top,.poll-footer{padding:15px} .checklist{grid-template-columns:1fr} .milestone{padding:19px} .choices{padding:16px} .logo{font-size:18px} .poll-grid{padding:7px} }
  </style>
</head>
<body>
  <header><div class="wrap">
    <div class="logo"><div class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.3" stroke-linecap="round"><path d="M3 10v4m4-8v12m4-15v18m4-14v10m4-8v6m3-4v2"/></svg></div> voice clone</div>
    <div class="top-right"><span class="sync" id="sync"></span><label class="person">You <select id="identity" aria-label="Select your name"></select></label></div>
  </div></header>
  <main class="wrap" id="app"></main>
  <script type="module">
    import { firebaseConfig } from './firebase-config.js';
    const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri'];
    const PEOPLE=[['amber','Amber',true],['rom','Rom',true],['basel','Basel',true],['reut','Reut',true],['doron','Doron',true],['roy','Roy',false],['omer','Omer',false]];
    const CHECKS=[['repo','Code accessible'],['voice','Voice clone runs'],['completion','Speech completion works'],['shared','Team can test demo']];
    const STATUS=[['not','Not started'],['progress','In progress'],['waiting','Waiting'],['done','Done']];
    const $=s=>document.querySelector(s);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const random=()=>Array.from(crypto.getRandomValues(new Uint8Array(18))).map(x=>x.toString(16).padStart(2,'0')).join('');
    const hashMatch=location.hash.match(/room=([a-f0-9]{20,60})/);
    const room=hashMatch?.[1] || localStorage.getItem('voice-board-room') || random();
    if(!hashMatch) history.replaceState(null,'',`${location.pathname}${location.search}#room=${room}`);
    localStorage.setItem('voice-board-room',room);
    let state=JSON.parse(localStorage.getItem(`voice-board-${room}`)||'{}');
    let actor=localStorage.getItem('voice-board-person')||'amber';
    let selectedChoice=null;
    let cloud=false, cloudError=false, cloudWrite=null, editingSchedule=false, paintMode=true, paintSlots=new Set();
    const members=()=>{ const base=PEOPLE.map(([id,name,active])=>({id,name,active,...(state.members?.[id]||{})})); const extra=Object.entries(state.members||{}).filter(([id])=>!PEOPLE.some(p=>p[0]===id)).map(([id,x])=>({id,...x})); return [...base,...extra]; };
    const active=()=>members().filter(x=>x.active);
    const avail=id=>state.availability?.[id]||{slots:[],submitted:false};
    const task=id=>state.tasks?.[id]||{text:'',status:'not'};
    const fmtTime=i=>`${String(9+Math.floor(i/2)).padStart(2,'0')}:${i%2?'30':'00'}`;
    function estimate(s) { const t=s.toLowerCase(); if(/model|train|pipeline|integrat|latency|real.time|hebrew|voice synth|clon|completion|realtime/.test(t))return 5; if(/test|evaluat|benchmark|pilot|protocol|study|experiment|interview/.test(t))return 3; if(/code|github|licens|deploy|cloud|hardware|debug|api|setup/.test(t))return 2; if(/email|share|meet|review|contact|decide|ask|sync|schedule/.test(t))return 1; return 3; }
    function due(days,from){ let d=from?new Date(from):new Date(); let n=Math.max(1,Math.ceil(days)); while(n>0){d.setDate(d.getDate()+1); if(d.getDay()!==5&&d.getDay()!==6)n--;} return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function assign(path,value){const bits=path.split('/');let p=state;for(const b of bits.slice(0,-1))p=p[b]??={};p[bits.at(-1)]=value;localStorage.setItem(`voice-board-${room}`,JSON.stringify(state));render();if(cloudWrite)cloudWrite(path,value).catch(error=>{cloudError=true;setSync('Sync error');console.error(error);});}
    function setSync(label){$('#sync').innerHTML=`<span class="dot ${cloud?'':'offline'}"></span>${esc(label)}`;}
    async function connect(){if(!firebaseConfig?.apiKey || firebaseConfig.apiKey.startsWith('PASTE_')){setSync('Local preview');render();return;}try{const [{initializeApp},{getAuth,signInAnonymously},{getDatabase,ref,onValue,set}]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js')]);const app=initializeApp(firebaseConfig);await signInAnonymously(getAuth(app));const db=getDatabase(app),root=`rooms/${room}`;cloudWrite=(path,value)=>set(ref(db,`${root}/${path}`),value);onValue(ref(db,root),snapshot=>{state=snapshot.val()||{};localStorage.setItem(`voice-board-${room}`,JSON.stringify(state));render();},error=>{cloudError=true;cloud=false;setSync('Sync error');console.error(error);});cloud=true;setSync('Live');render();}catch(error){cloudError=true;setSync('Sync error');console.error(error);render();}}
    function identityUI(){let m=members();if(!m.some(x=>x.id===actor))actor='amber';$('#identity').innerHTML=m.map(x=>`<option value="${esc(x.id)}" ${x.id===actor?'selected':''}>${esc(x.name)}${x.active?'':' · invited'}</option>`).join('');$('#identity').onchange=e=>{actor=e.target.value;localStorage.setItem('voice-board-person',actor);render();};}
    function notice(){return cloud?'':`<div class="preview-note">${cloudError?'Sync unavailable. Changes are on this browser only.':'Local preview. Connect Firebase to share updates.'}</div>`;}
    function currentMember(){return members().find(x=>x.id===actor);}
    function bestChoices(){const all=active();let options=[];for(let day=0;day<DAYS.length;day++)for(let i=0;i<19;i++){const a=`${day}-${i}`,b=`${day}-${i+1}`;const count=all.filter(m=>{let s=avail(m.id).slots||[];return s.includes(a)&&s.includes(b);}).length;if(count)options.push({day,i,count,key:a});}return options.sort((a,b)=>b.count-a.count||a.day-b.day||a.i-b.i).slice(0,6);}
    function renderPoll(){const all=active(),done=all.filter(m=>avail(m.id).submitted).length,ready=done===all.length;let now=avail(actor),my=now.slots||[];if(!selectedChoice)selectedChoice=bestChoices()[0]?.key||null;const options=bestChoices();const me=currentMember();let t=`${notice()}<div class="section-head"><div><div class="eyebrow">Step 1 of 2</div><h1>Pick a meeting time</h1><p class="sub">Every two weeks · 60 minutes · Israel time</p></div><div class="count">${done}/${all.length} ready</div></div>`;
    t+=`<section class="panel"><div class="poll-top"><div class="pill-row">${members().map(x=>`<span class="member-pill ${x.active?(avail(x.id).submitted?'done':''):'tentative'}">${esc(x.name)}${x.active&&avail(x.id).submitted?' ✓':''}</span>`).join('')}</div><div class="poll-controls"><span class="hint">Drag to select free times</span></div></div>`;
    t+=`<div class="poll-scroll"><table class="poll-grid"><thead><tr><th class="time"></th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>`;
    for(let i=0;i<20;i++){t+=`<tr class="${i%2===0?'hour-divider':''}"><td class="time">${i%2===0?fmtTime(i):''}</td>`;for(let d=0;d<DAYS.length;d++){const key=`${d}-${i}`;const total=all.filter(m=>(avail(m.id).slots||[]).includes(key)).length;const mine=my.includes(key);t+=`<td class="slot ${mine?'mine':''}" data-slot="${key}" style="background-color:rgba(57,136,94,${(total/all.length*.57+.035).toFixed(3)})" title="${total}/${all.length} available"></td>`;}t+=`</tr>`;}
    t+=`</tbody></table></div><div class="poll-footer"><div class="left">${me?.active?`<button class="primary" id="save-availability">${now.submitted?'Update availability':'Done'}</button>`:`<button class="primary" id="join">Join project</button>`}<button class="linkish" id="clear">Clear</button><span class="hint">${my.length} slots selected</span></div><button class="ghost small" id="share" ${cloud?'':'disabled'}>Copy invite link</button></div></section>`;
    if(ready){t+=`<section class="panel choices"><div class="label">Best meeting times</div>${options.length?`<div class="choices-list">${options.map(o=>`<button class="choice ${selectedChoice===o.key?'picked':''}" data-choice="${o.key}"><strong>${DAYS[o.day]} ${fmtTime(o.i)}</strong><span>${o.count}/${all.length} available</span></button>`).join('')}</div><div class="choices-bottom"><span class="hint">${options.some(x=>x.count===all.length)?'Full overlap available':'No full overlap. Choose the best option.'}</span><button class="primary" id="confirm" ${selectedChoice?'':'disabled'}>Set biweekly meeting</button></div>`:`<p class="hint">No overlapping time. Update availability.</p>`}</section>`;}
    $('#app').innerHTML=t;
    $('#join')?.addEventListener('click',()=>assign(`members/${actor}`,{name:me.name,active:true}));
    $('#clear').onclick=()=>{paintSlots.clear();assign(`availability/${actor}`,{slots:[],submitted:false});};
    $('#save-availability')?.addEventListener('click',()=>assign(`availability/${actor}`,{slots:[...my],submitted:true,updatedAt:new Date().toISOString()}));
    $('#share').onclick=()=>navigator.clipboard.writeText(location.href).then(()=>{$('#share').textContent='Copied';});
    document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{selectedChoice=el.dataset.choice;render();});
    $('#confirm')?.addEventListener('click',()=>{const opt=options.find(o=>o.key===selectedChoice);if(opt)assign('meeting',{day:opt.day,i:opt.i,confirmed:true,intervalWeeks:2,durationMinutes:60});});
    const grid=$('.poll-grid');
    const paint=key=>{if(!key||!me?.active)return;if(paintMode)paintSlots.add(key);else paintSlots.delete(key);const td=grid.querySelector(`[data-slot="${key}"]`);if(td){td.classList.toggle('mine',paintMode);td.style.backgroundColor=paintMode?'rgba(57,136,94,.55)':'#f6f8f6';}};
    grid.addEventListener('pointerdown',e=>{const key=e.target.closest('[data-slot]')?.dataset.slot;if(!key||!me?.active)return;e.preventDefault();editingSchedule=true;paintSlots=new Set(my);paintMode=!paintSlots.has(key);paint(key);});
    grid.addEventListener('pointermove',e=>{if(!editingSchedule)return;const key=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot]')?.dataset.slot;paint(key);});
    const finish=()=>{if(!editingSchedule)return;editingSchedule=false;assign(`availability/${actor}`,{slots:[...paintSlots],submitted:now.submitted||false,updatedAt:new Date().toISOString()});};
    window.addEventListener('pointerup',finish,{once:true});
    grid.addEventListener('click',e=>{const key=e.target.closest('[data-slot]')?.dataset.slot;if(!key||!me?.active||editingSchedule)return;if(!paintSlots.size)paintSlots=new Set(my);if(paintSlots.has(key))paintSlots.delete(key);else paintSlots.add(key);assign(`availability/${actor}`,{slots:[...paintSlots],submitted:now.submitted||false});});
    }
    function renderBoard(){const mt=state.meeting||{},done=CHECKS.filter(([id])=>state.milestone?.[id]).length,all=active(),updated=all.filter(x=>task(x.id).text).length;
    let html=`${notice()}<div class="section-head"><div><div class="eyebrow">Team board</div><h1>Next task</h1><p class="sub">One task per person</p></div><div class="inline-tools"><div class="meeting-chip">Every 2 weeks · ${DAYS[mt.day]} ${fmtTime(mt.i)}</div>${!currentMember()?.active?'<button class="ghost small" id="join-board">Join project</button>':''}</div></div>`;
    html+=`<section class="panel milestone"><div class="milestone-main"><div class="milestone-name">First milestone · Working demo</div><div class="milestone-count">${done}/${CHECKS.length}</div></div><div class="bar"><div style="width:${done/CHECKS.length*100}%"></div></div><details><summary>Checklist ${done===CHECKS.length?'✓':'⌄'}</summary><div class="checklist">${CHECKS.map(([id,label])=>`<label><input type="checkbox" data-check="${id}" ${state.milestone?.[id]?'checked':''}>${esc(label)}</label>`).join('')}</div></details></section>`;
    html+=`<section class="panel tasks"><table><thead><tr><th>Person</th><th>Next task</th><th>Status</th><th>Estimate</th><th>Due</th></tr></thead><tbody>`;
    for(const person of all){let t=task(person.id),own=person.id===actor,days=t.estManual?t.estDays:estimate(t.text),dueDate=t.dueManual?t.due:(t.text?due(days,t.startedAt||t.updatedAt):'');html+=`<tr class="${own?'own':''}"><td><div class="name"><span class="avatar">${esc(person.name.slice(0,2).toUpperCase())}</span>${esc(person.name)}</div></td>`;
    if(own){html+=`<td><input class="task-input" id="next-task" maxlength="220" value="${esc(t.text)}" placeholder="Your next task…" aria-label="Your next task">${t.status==='waiting'?`<input class="waiting-input" id="waiting-on" value="${esc(t.waitingFor||'')}" placeholder="Waiting for…" aria-label="Waiting for">`:''}</td><td><select class="status ${t.status||'not'}" id="status">${STATUS.map(([id,label])=>`<option value="${id}" ${t.status===id?'selected':''}>${label}</option>`).join('')}</select></td><td>${t.text?`<input class="eta-input" id="estimate" type="number" min="1" max="90" step="1" value="${days}" title="Suggested from task, editable"><span class="day-label">days</span>`:'<span class="muted">—</span>'}</td><td>${t.text?`<input class="due-input" type="date" id="due" value="${dueDate}" aria-label="Due date">`:'<span class="muted">—</span>'}</td>`;}
    else{html+=`<td><span class="task-view ${t.text?'':'muted'}">${esc(t.text||'—')}</span>${t.status==='waiting'&&t.waitingFor?`<div class="waiting-view">Waiting for ${esc(t.waitingFor)}</div>`:''}</td><td>${t.text?`<span class="status ${t.status||'not'}">${esc(STATUS.find(s=>s[0]===t.status)?.[1]||'Not started')}</span>`:'<span class="empty-status">—</span>'}</td><td>${t.text?`${days}d`:'—'}</td><td>${dueDate?esc(dueDate):'—'}</td>`;}
    html+='</tr>';}
    html+=`</tbody></table></section><div class="bottom"><span>${updated}/${all.length} tasks added</span><span>Changes save automatically</span></div>`;
    $('#app').innerHTML=html;
    $('#join-board')?.addEventListener('click',()=>assign(`members/${actor}`,{name:currentMember().name,active:true}));
    document.querySelectorAll('[data-check]').forEach(el=>el.onchange=e=>assign(`milestone/${e.target.dataset.check}`,e.target.checked));
    $('#next-task')?.addEventListener('change',e=>{let old=task(actor),newText=e.target.value.trim();if(newText===old.text)return;assign(`tasks/${actor}`,{text:newText,status:'not',estManual:false,dueManual:false,startedAt:new Date().toISOString(),updatedAt:new Date().toISOString()});});
    $('#status')?.addEventListener('change',e=>assign(`tasks/${actor}`,{...task(actor),status:e.target.value,updatedAt:new Date().toISOString()}));
    $('#estimate')?.addEventListener('change',e=>{let n=Number(e.target.value);if(n>=1&&n<=90)assign(`tasks/${actor}`,{...task(actor),estManual:true,estDays:n,updatedAt:new Date().toISOString()});});
    $('#due')?.addEventListener('change',e=>assign(`tasks/${actor}`,{...task(actor),dueManual:true,due:e.target.value,updatedAt:new Date().toISOString()}));
    $('#waiting-on')?.addEventListener('change',e=>assign(`tasks/${actor}`,{...task(actor),waitingFor:e.target.value.trim(),updatedAt:new Date().toISOString()}));
    }
    function render(){identityUI();if(state.meeting?.confirmed)renderBoard();else renderPoll();}
    render();connect();
  </script>
</body>
</html>
